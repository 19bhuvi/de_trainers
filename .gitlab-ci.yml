image: python:3.12

stages:
  - init_check
  - test

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

before_script:
  - python --version

check_python_compile:
  stage: init_check
  script:
    - python -m compileall -q .

run_unit_tests:
  stage: test
  script:
    - python -m unittest discover -s tests -p "test_*.py" -v
